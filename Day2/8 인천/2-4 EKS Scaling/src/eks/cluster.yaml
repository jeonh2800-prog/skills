apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: skills-sqs-cluster
  version: "1.35"
  region: us-west-2
  tags:
    karpenter.sh/discovery: skills-sqs-cluster

cloudWatch:
  clusterLogging:
    enableTypes: ["*"]

iam:
  withOIDC: true

karpenter:
  version: '1.12.1'
  createServiceAccount: true

vpc:
  subnets:
    public:
      ap-northeast-2a: { id: PUBLIC_A }
      ap-northeast-2c: { id: PUBLIC_C }
    private:
      ap-northeast-2a: { id: PRIVATE_A }
      ap-northeast-2c: { id: PRIVATE_C }

fargateProfiles:
  - name: "skills-sqs-system"
    selectors:
      - namespace: default
      - namespace: kube-system
  - name: "skills-sqs-fp-keda"
    selectors:
      - namespace: "keda"
  - name: "skills-sqs-fp-karpenter"
    selectors:
      - namespace: "karpenter"