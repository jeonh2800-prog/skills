apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: skm-app-nodepool
spec:
  template:
    spec:
      taints:
        - key: workload
          value: app
          effect: NoSchedule
      requirements:
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["t3.small", "t3.medium"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand", "spot"] 
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: skm-app-nodeclass        
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 60s
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: skm-app-nodeclass
spec:
  amiFamily: AL2023  
  amiSelectorTerms:
    - alias: al2023@latest    
  subnetSelectorTerms:
    - tags:
        Name: "*private*"        
  securityGroupSelectorTerms:
    - tags:
        aws:eks:cluster-name: "skm-eks-cluster"
    - tags:
        Name: "*skm-eks-cluster*"        
  role: "eksctl-KarpenterNodeRole-skm-eks-cluster"