# 4. Log Backend - Loki (Single Binary, monitoring NS)
# helm install o11y-loki grafana/loki -n monitoring -f loki-values.yaml
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  # OTLP Ingestion Endpoint 활성화 + structured metadata 허용
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true

singleBinary:
  replicas: 1
  # Chunks/Index 를 Persistent Volume 에 저장
  persistence:
    enabled: true
    size: 10Gi
    storageClass: gp2

# 단일 바이너리 외 컴포넌트 비활성화
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
chunksCache:
  enabled: false
resultsCache:
  enabled: false
gateway:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
