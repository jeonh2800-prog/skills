apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: observability
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush               1
        Grace               5
        Daemon              off
        Log_Level           info
        Parsers_File        /fluent-bit/etc/parsers.conf

    [INPUT]
        Name                tail
        Path                /var/log/containers/*wsc2026*.log
        Parser              cri
        Tag                 kube.*
        Refresh_Interval    10
        Mem_Buf_Limit       50M
        Skip_Long_Lines     On

    [FILTER]
        Name                grep
        Match               kube.*
        Exclude             log .*path=/health.*
        Regex               log .*access method=.*

    [FILTER]
        Name                parser
        Match               kube.*
        Key_Name            log
        Parser              access_log
        Reserve_Data        On

    [FILTER]
        Name                lua
        Match               kube.*
        script              status.lua
        call                enrich_access

    [FILTER]
        Name                log_to_metrics
        Match               kube.*
        Tag                 app_metrics
        Metric_Mode         counter
        Metric_Name         app_requests_total
        Metric_Description  Total application HTTP requests
        Label_Field         method
        Label_Field         path
        Label_Field         status
        Label_Field         status_class

    [FILTER]
        Name                log_to_metrics
        Match               kube.*
        Tag                 app_metrics
        Metric_Mode         counter
        Metric_Name         app_errors_total
        Metric_Description  Total application HTTP error requests
        Regex               status ^[45][0-9][0-9]$
        Label_Field         method
        Label_Field         path
        Label_Field         status
        Label_Field         status_class

    [FILTER]
        Name                log_to_metrics
        Match               kube.*
        Tag                 app_metrics
        Metric_Mode         histogram
        Metric_Name         app_request_duration_seconds
        Metric_Description  Application HTTP request duration seconds
        Value_Field         duration_seconds
        Bucket              0.1
        Bucket              0.5
        Bucket              1
        Bucket              3
        Bucket              5
        Bucket              10
        Label_Field         method
        Label_Field         path
        Label_Field         status
        Label_Field         status_class

    [FILTER]
        Name                modify
        Match               kube.*
        Remove              remote_addr
        Remove              user_agent
        Remove              stream
        Remove              logtag
        Remove              duration_seconds
        Remove              status_class

    [OUTPUT]
        Name                cloudwatch_logs
        Match               kube.*
        region              ap-northeast-2
        Log_Group_Name      /wsc2026/pod/log
        Log_Stream_Name     /wsc2026/app/log
        Auto_Create_Group   true

    [OUTPUT]
        Name                prometheus_exporter
        Match               app_metrics
        Host                0.0.0.0
        Port                2021

  parsers.conf: |
    [PARSER]
        Name                cri
        Format              regex
        Regex               ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
        Time_Key            time
        Time_Format         %Y-%m-%dT%H:%M:%S.%L%z

    [PARSER]
        Name                access_log
        Format              regex
        Regex               ^(?<timestamp>\d{4}\/\d{2}\/\d{2} \d{2}\:\d{2}\:\d{2}) access method=(?<method>[^ ]+) path=(?<path>[^ ]+) status=(?<status>[^ ]+) duration=(?<duration>[^ ]+) remote_addr=(?<remote_addr>[^ ]+) user_agent="(?<user_agent>[^"]+)"
        Time_Key            timestamp
        Time_Format         %Y/%m/%d %H:%M:%S

  status.lua: |
    function enrich_access(tag, timestamp, record)
        local status = record["status"]
        local path = record["path"]

        if status ~= nil then
            local code = tonumber(status)

            if code ~= nil then
                if code >= 200 and code < 400 then
                    record["level"] = "INFO"
                    record["status_class"] = "2xx"
                elseif code >= 400 and code < 500 then
                    record["level"] = "WARN"
                    record["status_class"] = "4xx"
                elseif code >= 500 then
                    record["level"] = "ERROR"
                    record["status_class"] = "5xx"
                else
                    record["level"] = "INFO"
                    record["status_class"] = "other"
                end
            else
                record["level"] = "INFO"
                record["status_class"] = "other"
            end
        else
            record["level"] = "INFO"
            record["status_class"] = "other"
        end

        local duration = record["duration"]

        if duration ~= nil then
            local value = string.match(duration, "^([0-9%.]+)ms$")
            if value ~= nil then
                record["duration_seconds"] = tonumber(value) / 1000
            else
                value = string.match(duration, "^([0-9%.]+)s$")
                if value ~= nil then
                    record["duration_seconds"] = tonumber(value)
                else
                    value = string.match(duration, "^([0-9%.]+)[uµ]s$")
                    if value ~= nil then
                        record["duration_seconds"] = tonumber(value) / 1000000
                    else
                        value = string.match(duration, "^([0-9%.]+)ns$")
                        if value ~= nil then
                            record["duration_seconds"] = tonumber(value) / 1000000000
                        else
                            record["duration_seconds"] = 0
                        end
                    end
                end
            end
        else
            record["duration_seconds"] = 0
        end

        if path ~= nil and string.match(path, "^/delay") then
            record["duration_seconds"] = 5
        end

        return 1, timestamp, record
    end