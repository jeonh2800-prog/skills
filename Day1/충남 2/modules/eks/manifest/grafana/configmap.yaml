apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-wskorea26-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  wskorea26-dashboard.json: |
    {
      "uid": "wskorea26-monitoring",
      "title": "wskorea26-monitoring",
      "schemaVersion": 39,
      "timezone": "browser",
      "time": { "from": "now-1h", "to": "now" },
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Container CPU Usage",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "sum(rate(container_cpu_usage_seconds_total{container!=\"\", container!=\"POD\"}[5m])) by (pod)", "legendFormat": "{{pod}}" }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Container Memory Usage",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "sum(container_memory_working_set_bytes{container!=\"\", container!=\"POD\"}) by (pod)", "legendFormat": "{{pod}}" }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Running Pod Count",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "count(kube_pod_status_phase{phase=\"Running\"} == 1)" }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Container Restart Count",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "sum(kube_pod_container_status_restarts_total) by (pod)", "legendFormat": "{{pod}}" }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Container Network Receive",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "sum(rate(container_network_receive_bytes_total[5m])) by (pod)", "legendFormat": "{{pod}}" }
          ]
        }
      ]
    }
